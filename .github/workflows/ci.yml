name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install
        run: python -m pip install -c requirements-ci.txt -e ".[dev,demo,deploy]"
      - name: Dependency check
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy keyvision scripts tests
      - name: Unit tests
        run: pytest --cov=keyvision --cov-report=term --cov-fail-under=60
      - name: Documentation check
        run: python scripts/check_docs.py
      - name: Package build
        run: python -m build
      - name: End-to-end synthetic smoke test
        run: python scripts/smoke_test.py