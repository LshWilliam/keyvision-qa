data:
  root: artifacts/dataset
  train_manifest: splits/train.jsonl
  val_manifest: splits/val.jsonl
  test_manifest: splits/test.jsonl
  image_size: 640
  num_workers: 4

model:
  architecture: fasterrcnn_mobilenet_v3_large_320_fpn
  num_classes: 6
  class_names:
    - missing_keycap
    - misaligned_keycap
    - print_defect
    - stain
    - scratch
    - foreign_object
  score_threshold: 0.35
  pretrained: true

training:
  seed: 42
  epochs: 50
  batch_size: 4
  learning_rate: 0.0005
  weight_decay: 0.0001
  device: auto
  output_dir: artifacts/runs/fasterrcnn
  resume: null

