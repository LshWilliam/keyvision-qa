data:
  root: artifacts/synthetic
  train_manifest: splits/train.jsonl
  val_manifest: splits/val.jsonl
  test_manifest: splits/test.jsonl
  image_size: 160
  num_workers: 0

model:
  architecture: tiny
  num_classes: 6
  class_names:
    - missing_keycap
    - misaligned_keycap
    - print_defect
    - stain
    - scratch
    - foreign_object
  score_threshold: 0.20
  pretrained: false

training:
  seed: 42
  epochs: 1
  batch_size: 4
  learning_rate: 0.002
  weight_decay: 0.0001
  device: cpu
  output_dir: artifacts/runs/smoke
  resume: null

