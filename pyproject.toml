[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyvision-qa"
version = "0.1.0"
description = "Industrial keyboard defect inspection, anomaly localization, and ONNX deployment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KeyVision-QA contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
]

[project.optional-dependencies]
demo = ["gradio>=5,<7"]
deploy = ["onnx>=1.16,<2", "onnxruntime>=1.18,<2"]
vision = ["opencv-python-headless>=4.9,<5"]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
keyvision-generate = "keyvision.data.synthetic:main"
keyvision-validate = "keyvision.data.validation:main"
keyvision-train = "keyvision.training.train:main"
keyvision-evaluate = "keyvision.evaluation.cli:main"
keyvision-infer = "keyvision.inference.cli:main"
keyvision-export = "keyvision.deployment.export_onnx:main"
keyvision-train-anomaly = "keyvision.training.train_anomaly:main"
keyvision-onnx-infer = "keyvision.deployment.onnx_infer:main"

[tool.setuptools.packages.find]
include = ["keyvision*"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

